name: Deploy Portal Realm to GitHub Pages

on:
  push:
    branches: [main, master, beta]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout alpha (master)
        uses: actions/checkout@v4
        with:
          ref: master
          path: alpha-src

      - name: Checkout beta
        uses: actions/checkout@v4
        with:
          ref: beta
          path: beta-src

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: alpha-src/package-lock.json

      - name: Build alpha → /alpha/
        working-directory: alpha-src
        env:
          VITE_CHANNEL: alpha
        run: |
          npm ci
          npm run build
          mkdir -p ../_site/alpha
          cp -a client/dist/. ../_site/alpha/

      - name: Build beta → /
        working-directory: beta-src
        env:
          VITE_CHANNEL: beta
        run: |
          npm ci
          npm run build
          mkdir -p ../_site
          cp -a client/dist/. ../_site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
